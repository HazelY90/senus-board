spring:
  application:
    name: SenusBoard

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    open-in-view: true

  jwt:
    secret: ${JWT_SECRET_KEY}
    accessTokenExpiration: 1800 # 0.5h
    refreshTokenExpiration: 604800 # 7 d

app:
  baseUrl: ${BASEURL:.}
